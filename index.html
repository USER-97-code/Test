<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth – Login, Cadastro & Recuperação</title>

    <style>
        /* ---------- Fundo animado ---------- */
        body{
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            margin:0;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
            background:#111;
        }
        .bg-circle{
            position:absolute;
            border-radius:50%;
            opacity:0.6;
            animation: float 12s infinite ease-in-out;
        }
        .c1{ width:200px;height:200px;background:#ff6b6b;top:10%;left:-100px;animation-delay:0s; }
        .c2{ width:300px;height:300px;background:#f7d794;top:60%;left:-150px;animation-delay:2s; }
        .c3{ width:250px;height:250px;background:#6a11cb;top:30%;left:80%;animation-delay:4s; }
        .c4{ width:180px;height:180px;background:#2575fc;top:80%;left:70%;animation-delay:6s; }
        .c5{ width:220px;height:220px;background:#ff6b6b;top:50%;left:40%;animation-delay:8s; }
        @keyframes float{
            0%{transform:translate(0,0) scale(1);}
            50%{transform:translate(30px,-30px) scale(1.2);}
            100%{transform:translate(0,0) scale(1);}
        }

        /* ---------- Card base ---------- */
        .card{
            background:#fff;
            border-radius:12px;
            box-shadow:0 12px 30px rgba(0,0,0,0.15);
            width:380px;
            max-width:95%;
            padding:2rem;
            position:relative;
            z-index:1;
        }
        h2{ text-align:center;margin-bottom:1.5rem;color:#333; }

        .input-group{
            margin-bottom:1.2rem;
            display:flex;
            flex-direction:column;
        }
        .input-group label{
            margin-bottom:.4rem;
            font-size:.9rem;
            color:#555;
        }
        .input-group input{
            padding:.75rem 1rem;
            border:1px solid #ddd;
            border-radius:8px;
            font-size:1rem;
            transition:border-color .2s,box-shadow .2s;
        }
        .input-group input:focus{
            outline:none;
            border-color:#6a11cb;
            box-shadow:0 0 0 3px rgba(106,17,203,0.1);
        }

        .btn-primary{
            width:100%;
            padding:.85rem;
            background:#6a11cb;
            color:#fff;
            border:none;
            border-radius:8px;
            font-size:1rem;
            cursor:pointer;
            transition:background .2s,transform .1s;
        }
        .btn-primary:hover{background:#5a0fb5;}
        .btn-primary:active{transform:translateY(1px);}

        .extra-links,
        .social-links,
        .back-link{
            margin-top:1rem;
            text-align:center;
        }
        .extra-links a,
        .social-links button,
        .back-link a{
            color:#6a11cb;
            text-decoration:none;
            background:none;
            border:none;
            font-size:0.9rem;
            cursor:pointer;
            transition:opacity .2s;
        }
        .extra-links a:hover,
        .social-links button:hover,
        .back-link a:hover{opacity:.8;}

        .social-links button{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:0.4rem;
            width:100%;
            padding:.6rem;
            border:1px solid #6a11cb;
            border-radius:8px;
            background:#fff;
        }

        @media (max-width:420px){ .card{padding:1.5rem;} }
    </style>
</head>
<body>

    <!-- Círculos de fundo -->
    <div class="bg-circle c1"></div>
    <div class="bg-circle c2"></div>
    <div class="bg-circle c3"></div>
    <div class="bg-circle c4"></div>
    <div class="bg-circle c5"></div>

    <!-- ---------- Login ---------- -->
    <div class="card" id="loginCard">
        <form class="login-form" action="#" method="POST">
            <h2>Bem‑vindo</h2>

            <div class="input-group">
                <label for="loginEmail">E‑mail</label>
                <input type="email" id="loginEmail" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="input-group">
                <label for="loginPassword">Senha</label>
                <input type="password" id="loginPassword" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary">Entrar</button>

            <div class="extra-links">
                <a href="#" id="showForgot">Esqueceu a senha?</a> |
                <a href="#" id="showRegister">Criar conta</a>
            </div>

            <div class="social-links">
                <button id="loginGmail"><span>📧</span>Entrar com Gmail</button>
                <button id="loginProton"><span>🔐</span>Entrar com ProtonMail</button>
            </div>
        </form>
    </div>

    <!-- ---------- Cadastro ---------- -->
    <div class="card" id="registerCard" style="display:none;">
        <form class="register-form" action="#" method="POST">
            <h2>Criar Conta</h2>

            <div class="input-group">
                <label for="fullname">Nome completo</label>
                <input type="text" id="fullname" name="fullname" placeholder="Seu nome" required>
            </div>

            <div class="input-group">
                <label for="registerEmail">E‑mail</label>
                <input type="email" id="registerEmail" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="input-group">
                <label for="registerPassword">Senha</label>
                <input type="password" id="registerPassword" name="password" placeholder="••••••••" required>
            </div>

            <div class="input-group">
                <label for="phone">Número de telemóvel</label>
                <input type="tel" id="phone" name="phone" placeholder="+351 912 345 678" required>
            </div>

            <button type="submit" class="btn-primary">Cadastrar</button>

            <div class="back-link">
                <a href="#" id="showLoginFromRegister">← Voltar ao login</a>
            </div>
        </form>
    </div>

    <!-- ---------- Recuperação de senha ---------- -->
    <div class="card" id="forgotCard" style="display:none;">
        <form class="forgot-form" action="#" method="POST">
            <h2>Recuperar senha</h2>

            <div class="input-group">
                <label for="forgotEmail">Informe seu e‑mail</label>
                <input type="email" id="forgotEmail" name="email" placeholder="seu@email.com" required>
            </div>

            <button type="submit" class="btn-primary">Enviar link de redefinição</button>

            <div class="back-link">
                <a href="#" id="showLoginFromForgot">← Voltar ao login</a>
            </div>
        </form>
    </div>

    <script>
        // Elementos de navegação
        const loginCard    = document.getElementById('loginCard');
        const registerCard = document.getElementById('registerCard');
        const forgotCard   = document.getElementById
